<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-secondary-fixed-dim">
<!-- TopAppBar -->
<header class="bg-primary-container shadow-sm flex justify-between items-center px-gutter min-h-touch-target-min w-full z-50 fixed top-0">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="person">person</span>
</div>
<span class="font-headline-md text-[18px] leading-tight font-bold text-on-primary">ROCEEL Operativo</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-primary hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined" data-icon="sensors">sensors</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-safe px-margin-mobile flex flex-col">
<div class="mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">Resumen de jornada</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Revisa tus horas y reportes antes de finalizar el turno.</p>
</div>
<!-- Bento Grid for Hours -->
<div class="grid grid-cols-2 gap-3 mb-4">
<!-- Horas Normales -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col justify-between shadow-sm">
<div class="flex items-center gap-2 mb-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="schedule">schedule</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase">Normales</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-headline-md text-headline-md text-on-surface">08</span>
<span class="font-label-sm text-label-sm text-outline">h</span>
<span class="font-headline-md text-headline-md text-on-surface ml-1">30</span>
<span class="font-label-sm text-label-sm text-outline">m</span>
</div>
</div>
<!-- Horas Extra -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-4 flex flex-col justify-between shadow-sm">
<div class="flex items-center gap-2 mb-3 text-secondary">
<span class="material-symbols-outlined text-[18px]" data-icon="more_time">more_time</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase">Extra</span>
</div>
<div class="flex items-baseline gap-1 text-secondary">
<span class="font-headline-md text-headline-md">01</span>
<span class="font-label-sm text-label-sm opacity-80">h</span>
<span class="font-headline-md text-headline-md ml-1">15</span>
<span class="font-label-sm text-label-sm opacity-80">m</span>
</div>
</div>
<!-- Horas Tránsito (Full width span) -->
<div class="col-span-2 bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-row items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="commute">commute</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Tránsito</span>
<div class="flex items-baseline gap-1">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">00 h 45 m</span>
</div>
</div>
</div>
</div>
</div>

<div class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-row items-center justify-between shadow-sm mb-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="description">description</span>

<span class="material-symbols-outlined" data-icon="logout">logout</span>

            </button>
