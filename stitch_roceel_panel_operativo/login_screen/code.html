<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center relative p-margin-mobile md:p-margin-desktop antialiased">
<!-- Decorative ambient background element (subtle) -->
<div class="fixed top-0 left-0 w-full h-[265px] bg-gradient-to-b from-surface-container-high to-transparent pointer-events-none z-0 opacity-50"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-margin-mobile md:p-margin-desktop shadow-sm flex flex-col">
<!-- Logo / Brand Header -->
<div class="flex flex-col items-center justify-center mb-8">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-4 border border-outline-variant shadow-sm">
<span class="material-symbols-outlined text-secondary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">
                        engineering
                    </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface text-center mb-2">
                    Iniciar sesión
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                    Accede con tu número de empleado
                </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-[24px]">
<!-- Input: Employee Number -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="employee-id">
                        Número de empleado
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                            badge
                        </span>
<input autocomplete="username" class="w-full h-touch-target-min pl-10 pr-4 bg-surface border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:border-secondary-container focus:ring-1 focus:ring-secondary-container outline-none transition-all" id="employee-id" placeholder="Ej. 12345" type="text"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">
                        Contraseña
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                            lock
                        </span>
<input autocomplete="current-password" class="w-full h-touch-target-min pl-10 pr-10 bg-surface border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:border-secondary-container focus:ring-1 focus:ring-secondary-container outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors h-[32px] w-[32px] flex items-center justify-center rounded-full" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">
                                visibility_off
                            </span>
</button>
</div>
</div>
<!-- Submit Action -->
<button class="h-touch-target-min w-full bg-secondary-container text-on-secondary-container font-label-md text-label-md rounded-xl hover:bg-secondary hover:text-on-secondary active:bg-[#00531a] flex items-center justify-center gap-2 transition-all mt-4 shadow-sm hover:shadow-md" type="button">
                    Ingresar
                    <span class="material-symbols-outlined" style="font-size: 20px;">
                        login
                    </span>
</button>
</form>
