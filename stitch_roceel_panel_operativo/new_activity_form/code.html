<body class="bg-background text-on-surface font-body-md min-h-screen antialiased flex flex-col">
<!-- TopAppBar (Contextual for Task) -->
<header class="bg-primary-container text-on-primary shadow-sm flex items-center px-gutter h-touch-target w-full z-50 sticky top-0 shrink-0">
<button aria-label="Volver" class="h-[48px] w-[48px] flex items-center justify-center mr-sm -ml-sm rounded-full hover:bg-primary/10 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold flex-1 truncate">Nueva actividad</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto p-md pb-[100px] flex flex-col gap-lg">
<!-- Section: Detalles -->
<section class="flex flex-col gap-md">
<h2 class="font-headline-sm text-headline-sm text-text-primary">Detalles</h2>
<div class="bg-surface-card border border-border-subtle rounded-lg shadow-sm p-md flex flex-col gap-md">
<!-- Input: Cliente -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="cliente-select">Cliente</label>
<div class="relative">
<select class="w-full h-touch-target px-md border border-outline-variant rounded bg-surface-card text-on-surface font-body-lg focus:outline-none focus:border-2 focus:border-info focus:ring-0 appearance-none transition-colors" id="cliente-select">
<option disabled="" value="">Selecciona un cliente</option>
<option selected="" value="gm">Planta GM</option>
<option value="ford">Ford Motors</option>
<option value="nissan">Nissan Planta Sur</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<!-- Input: Actividad -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="actividad-select">Actividad</label>
<div class="relative">
<select class="w-full h-touch-target px-md border border-outline-variant rounded bg-surface-card text-on-surface font-body-lg focus:outline-none focus:border-2 focus:border-info focus:ring-0 appearance-none transition-colors" id="actividad-select">
<option disabled="" value="">Selecciona una actividad</option>
<option selected="" value="mantenimiento_husillo">Mantenimiento husillo</option>
<option value="inspeccion">Inspección general</option>
<option value="reparacion">Reparación de motor</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<!-- Input: Orden de trabajo -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="ot-select">Orden de trabajo</label>
<div class="relative">
<select class="w-full h-touch-target px-md border border-outline-variant rounded bg-surface-card text-on-surface font-body-lg focus:outline-none focus:border-2 focus:border-info focus:ring-0 appearance-none transition-colors" id="ot-select">
<option disabled="" value="">Selecciona orden</option>
<option selected="" value="roc1">ROC-2026-0001</option>
<option value="roc2">ROC-2026-0002</option>
<option value="sin_orden">Crear sin orden</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
</div>
</section>
<!-- Section: Notas -->
<section class="flex flex-col gap-md">
<h2 class="font-headline-sm text-headline-sm text-text-primary">Notas</h2>
<div class="bg-surface-card border border-border-subtle rounded-lg shadow-sm p-md">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="notas-textarea">Notas (opcional)</label>
<textarea class="w-full min-h-[120px] p-md border border-outline-variant rounded bg-surface-card text-on-surface font-body-lg focus:outline-none focus:border-2 focus:border-info focus:ring-0 resize-y transition-colors" id="notas-textarea" placeholder="Agrega detalles o especificaciones técnicas relevantes..."></textarea>
</div>
</div>
</section>
<!-- Info Card: Ubicación -->
<div class="bg-surface-variant rounded-lg p-md flex gap-md items-start shadow-sm mt-sm">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">location_on</span>
<p class="font-body-md text-body-md text-on-surface-variant leading-tight pt-xs">
                Esta actividad se vinculará a tu ubicación actual: <span class="font-bold text-on-surface">Planta GM</span>
</p>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-md bg-surface-card border-t border-border-subtle shadow-[0px_-2px_10px_rgba(15,23,42,0.05)] z-40 pb-safe">
<div class="max-w-3xl mx-auto">
<button class="w-full h-touch-target bg-extra-hour text-on-primary font-label-lg text-label-lg font-bold uppercase rounded flex items-center justify-center gap-sm active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Iniciar actividad
            </button>
</div>
</div>
