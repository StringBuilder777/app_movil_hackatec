<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">
<!-- Task-specific TopAppBar (Navigation Shell Suppressed due to task-focus) -->
<header class="flex justify-between items-center px-gutter h-[64px] w-full z-50 bg-primary-container text-on-primary shadow-sm shrink-0">
<button aria-label="Volver" class="h-touch-target-min w-touch-target-min flex items-center justify-center rounded-full hover:bg-primary/10 transition-colors -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold truncate flex-1 text-center pr-[40px]">Reporte de actividad</h1>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col px-gutter py-margin-desktop max-w-3xl mx-auto w-full gap-6">
<!-- Metadata Card (Level 1 Elevation) -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col gap-5 shadow-sm">
<!-- Timestamp -->
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">schedule</span>
</div>
<div class="flex-1">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Timestamp</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">12 Oct 2023, 14:30 hrs</p>
</div>
</div>
<div class="h-px bg-outline-variant/30 w-full"></div>
<!-- GPS -->
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">location_on</span>
</div>
<div class="flex-1">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Ubicación GPS</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">Lat: 19.4326, Lng: -99.1332</p>
<p class="font-label-sm text-label-sm text-outline mt-0.5">Planta Norte - Sector B</p>
</div>
</div>
<div class="h-px bg-outline-variant/30 w-full"></div>
<!-- Activity -->
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">engineering</span>
</div>
<div class="flex-1">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Actividad Asignada</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">Mantenimiento preventivo de válvulas de presión</p>
</div>
</div>
</section>
<!-- Report Input Area -->
<section class="flex flex-col gap-2 flex-1">
<label class="font-label-md text-label-md text-on-surface pl-1" for="reportContent">
                ¿Qué se hizo? <span class="text-error">*</span>
</label>
<div class="relative flex-1 min-h-[200px]">
<textarea class="w-full h-full min-h-[200px] p-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary-container focus:border-secondary-container resize-none shadow-sm transition-shadow placeholder:text-outline/70" id="reportContent" maxlength="1000" placeholder="Describe detalladamente las acciones realizadas, herramientas utilizadas y observaciones relevantes..."></textarea>
</div>
<div class="flex justify-between items-center px-1 mt-1">
<span class="font-label-sm text-label-sm text-error opacity-0 transition-opacity" id="errorMessage">El reporte no puede estar vacío.</span>
<span class="font-label-sm text-label-sm text-outline ml-auto" id="charCounter">0 / 1000</span>
</div>
</section>
<!-- Action Buttons (Sticky on mobile if needed, but flex-col keeps them at bottom) -->
<section class="flex gap-4 pt-6 pb-margin-mobile border-t border-outline-variant/30 mt-auto">
<button class="flex-1 h-touch-target-min flex items-center justify-center rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low active:bg-surface-container transition-colors" type="button">
                Cancelar
            </button>
<button class="flex-1 h-touch-target-min flex items-center justify-center rounded-xl bg-secondary-container text-on-secondary-container font-label-md text-label-md shadow-sm hover:brightness-95 active:brightness-90 transition-all" id="saveBtn" type="button">
                Guardar reporte
            </button>
</section>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('reportContent');
            const counter = document.getElementById('charCounter');
            const saveBtn = document.getElementById('saveBtn');
            const errorMessage = document.getElementById('errorMessage');

            // Character counter logic
            textarea.addEventListener('input', (e) => {
                const currentLength = e.target.value.length;
                counter.textContent = `${currentLength} / 1000`;
                
                if (currentLength > 0) {
                    errorMessage.classList.add('opacity-0');
                    textarea.classList.remove('border-error', 'focus:ring-error', 'focus:border-error');
                    textarea.classList.add('border-outline-variant', 'focus:ring-secondary-container', 'focus:border-secondary-container');
                }
            });

            // Basic validation on save
            saveBtn.addEventListener('click', () => {
                if (textarea.value.trim() === '') {
                    errorMessage.classList.remove('opacity-0');
                    textarea.classList.remove('border-outline-variant', 'focus:ring-secondary-container', 'focus:border-secondary-container');
                    textarea.classList.add('border-error', 'focus:ring-error', 'focus:border-error');
                    textarea.focus();
                    
                    // Shake animation effect
                    textarea.style.transform = 'translateX(-5px)';
                    setTimeout(() => textarea.style.transform = 'translateX(5px)', 50);
                    setTimeout(() => textarea.style.transform = 'translateX(-5px)', 100);
                    setTimeout(() => textarea.style.transform = 'translateX(5px)', 150);
                    setTimeout(() => textarea.style.transform = 'translateX(0)', 200);
                } else {
                    // Simulate save action
                    saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Guardando...';
                    saveBtn.classList.add('opacity-80', 'cursor-not-allowed');
                    
                    setTimeout(() => {
                        saveBtn.innerHTML = '<span class="material-symbols-outlined mr-2">check</span> Guardado';
                        saveBtn.classList.replace('bg-secondary-container', 'bg-on-surface');
                        saveBtn.classList.replace('text-on-secondary-container', 'text-surface');
                    }, 1500);
                }
            });
        });
    </script>
</body></html>
